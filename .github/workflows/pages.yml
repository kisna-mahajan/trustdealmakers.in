# Publishes the site to GitHub Pages.
# tools/build-site.mjs writes _site/ with a real page per route (/about/, /industrial/, ...),
# so direct links and search engines get each page with status 200 instead of a 404 + redirect.
# Repository setting required once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build pages
        run: node tools/build-site.mjs
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # keep .well-known/security.txt and .nojekyll
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
